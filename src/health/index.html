<!doctype html>
<html lang="en" data-color-scheme="health-black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health CTA Banner</title>
    <link rel="stylesheet" href="../styles/tokens/css/havas-network-websites.reference.css" />
    <link rel="stylesheet" href="../styles/tokens/css/havas-network-websites.tokens.css" />
    <link rel="stylesheet" href="../shared/css/global.css" />
    <link rel="stylesheet" href="../shared/css/demo-shell.css" />
    <link rel="stylesheet" href="../shared/css/button.css" />
    <link rel="stylesheet" href="health-button.css" />
    <link rel="stylesheet" href="../shared/css/cta-banner.css" />
    <link rel="stylesheet" href="project.css" />
  </head>
  <body class="project-page theme-health">
    <main class="project-content">
      <section class="demo-panel">
        <header>
          <h2>Full-page color scheme</h2>
          <div class="scheme-controls" data-scheme-controls="page">
            <button class="scheme-button is-active" type="button" data-scheme-value="health-black">Black</button>
            <button class="scheme-button" type="button" data-scheme-value="health-white">White</button>
            <button class="scheme-button" type="button" data-scheme-value="health-off-white">Off white</button>
          </div>
        </header>
        <div class="demo-stage">
          <section class="f f-cta-health" aria-label="Health CTA banner">
            <div class="f-cta-health__inner container">
              <h2 class="f-cta-health__title split-texte">
                Join our network and shape the future of health
              </h2>
              <p class="fade-slide-in">
                <a class="btn btn--primary" href="#"><span>Join our network</span></a>
              </p>
            </div>
          </section>
        </div>
      </section>

      <section class="demo-panel">
        <header>
          <h2>Component-scoped color scheme</h2>
          <div class="scheme-controls" data-scheme-controls="component">
            <button class="scheme-button is-active" type="button" data-scheme-value="health-black">Black</button>
            <button class="scheme-button" type="button" data-scheme-value="health-white">White</button>
            <button class="scheme-button" type="button" data-scheme-value="health-off-white">Off white</button>
          </div>
        </header>
        <div class="demo-stage component-scope-stage">
          <section class="f f-cta-health" data-component-preview data-color-scheme="health-black" aria-label="Health scoped CTA banner">
            <div class="f-cta-health__inner container">
              <h2 class="f-cta-health__title split-texte">
                Join our network and shape the future of health
              </h2>
              <p class="fade-slide-in">
                <a class="btn btn--primary" href="#"><span>Join our network</span></a>
              </p>
            </div>
          </section>
        </div>
      </section>

      <section class="demo-panel">
        <header>
          <h2>Button styles</h2>
        </header>
        <div class="demo-stage">
          <div class="button-swatch-grid">
            <div class="button-swatch" data-color-scheme="health-white">
              <a class="btn btn--primary" href="#"><span>What we do</span></a>
              <a class="btn btn--secondary" href="#"><span>Our work</span></a>
              <a class="btn text-link-btn" href="#"><span>Text Link</span></a>
            </div>
            <div class="button-swatch" data-color-scheme="health-black">
              <a class="btn btn--primary" href="#"><span>Primary button</span></a>
              <a class="btn btn--secondary" href="#"><span>Secondary button</span></a>
              <a class="btn text-link-btn" href="#"><span>Text Link</span></a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../shared/js/color-schemes.js"></script>
  </body>
</html>
